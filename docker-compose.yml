services:
  mysql:
    image: mysql:8.4
    container_name: sentence_database_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sentence_db}
      MYSQL_USER: ${MYSQL_USER:-sentence_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sentence_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-sentence_user} -p${MYSQL_PASSWORD:-sentence_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
